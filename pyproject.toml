[project]
name = "pons-copy-trading-bot"
version = "1.0.0"
description = "Copy-trade pons.family wallets on Robinhood Chain"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "web3>=7.8.0",
  "eth-account>=0.13.0",
  "eth-abi>=5.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
ponsbot = "bot.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
